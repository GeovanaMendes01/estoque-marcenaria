<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedores - Marcenaria Stock</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<aside class="sidebar">

    <div class="sidebar-logo">
        <i class="fas fa-tools sidebar-logo-icon"></i>
        <div class="sidebar-logo-texto">
            <span class="sidebar-logo-nome">Marcenaria</span>
            <span class="sidebar-logo-sub">Sistema de Estoque</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <div class="nav-grupo">
            <span class="nav-label">PRINCIPAL</span>
            <ul>
                <li>
                    <a href="/" class="nav-item">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">ESTOQUE</span>
            <ul>
                <li>
                    <a href="/produtos" class="nav-item">
                        <i class="fas fa-boxes"></i>
                        Produtos
                    </a>
                </li>
                <li>
                    <a href="/fornecedores" class="nav-item ativo">
                        <i class="fas fa-truck"></i>
                        Fornecedores
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">MOVIMENTAÇÕES</span>
            <ul>
                <li>
                    <a href="/baixas" class="nav-item">
                        <i class="fas fa-arrow-circle-down"></i>
                        Baixas
                    </a>
                </li>
            </ul>
        </div>

    </nav>

</aside>

<main class="conteudo">

    <div class="pagina-header">
        <div class="pagina-header-titulo">
            <i class="fas fa-truck"></i>
            <h1>Fornecedores</h1>
        </div>
        <a href="/fornecedores/cadastro" class="btn-novo">
            <i class="fas fa-plus"></i> Novo Fornecedor
        </a>
    </div>

    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <div class="tabela-container">
        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>CNPJ</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="fornecedor : ${fornecedores}">
                <td th:text="${fornecedor.nome}"></td>
                <td th:text="${fornecedor.cnpj}"></td>
                <td th:text="${fornecedor.telefone}"></td>
                <td th:text="${fornecedor.email}"></td>
                <td class="acoes-tabela">
                    <a th:href="@{/fornecedores/editar/{id}(id=${fornecedor.id})}">Editar</a>
                    <a th:href="@{/fornecedores/excluir/{id}(id=${fornecedor.id})}"
                       onclick="return confirm('Confirma a exclusão deste fornecedor?')">Excluir</a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(fornecedores)}">
                <td colspan="5" class="tabela-vazia">
                    Nenhum fornecedor cadastrado.
                    <a href="/fornecedores/cadastro">Cadastrar agora</a>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</main>

</body>
</html>
