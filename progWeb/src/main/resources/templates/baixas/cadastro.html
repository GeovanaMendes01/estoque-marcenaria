<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Baixa - Marcenaria Stock</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<aside class="sidebar">

    <div class="sidebar-logo">
        <i class="fas fa-tools sidebar-logo-icon"></i>
        <div class="sidebar-logo-texto">
            <span class="sidebar-logo-nome">Marcenaria</span>
            <span class="sidebar-logo-sub">Sistema de Estoque</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <div class="nav-grupo">
            <span class="nav-label">PRINCIPAL</span>
            <ul>
                <li>
                    <a href="/" class="nav-item">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">ESTOQUE</span>
            <ul>
                <li>
                    <a href="/produtos" class="nav-item">
                        <i class="fas fa-boxes"></i>
                        Produtos
                    </a>
                </li>
                <li>
                    <a href="/fornecedores" class="nav-item">
                        <i class="fas fa-truck"></i>
                        Fornecedores
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">MOVIMENTAÇÕES</span>
            <ul>
                <li>
                    <a href="/baixas" class="nav-item ativo">
                        <i class="fas fa-arrow-circle-down"></i>
                        Baixas
                    </a>
                </li>
            </ul>
        </div>

    </nav>

</aside>

<main class="conteudo">

    <div class="pagina-header">
        <div class="pagina-header-titulo">
            <i class="fas fa-arrow-circle-down"></i>
            <h1>Nova Baixa</h1>
        </div>
        <a href="/baixas" class="btn-voltar">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="form-card">

        <form action="/baixas/salvar" method="post">

            <div class="form-grid-2">

                <div class="form-grupo">
                    <label for="data">Data</label>
                    <input id="data" name="data" type="date" required>
                </div>

                <div class="form-grupo">
                    <label for="quantidade">Quantidade</label>
                    <input id="quantidade" name="quantidade" type="number" min="1" placeholder="0" required>
                </div>

            </div>

            <div class="form-grupo">
                <label for="produto">Produto</label>
                <select id="produto" name="produto.id" required>
                    <option value="">Selecione um produto</option>
                    <option
                            th:each="produto : ${produtos}"
                            th:value="${produto.id}"
                            th:text="${produto.nome} + ' (estoque: ' + ${produto.quantidade} + ')'">
                    </option>
                </select>
            </div>

            <div class="form-botoes">
                <button type="submit" class="btn-salvar">
                    <i class="fas fa-save"></i> Registrar
                </button>
                <a href="/baixas" class="btn-cancelar">Cancelar</a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
