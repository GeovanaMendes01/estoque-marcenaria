<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fornecedores - Marcenaria Stock</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <h1>Fornecedores</h1>

    <a href="/fornecedores/cadastro">Novo Fornecedor</a>

    <br><br>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>CNPJ</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fornecedor : ${fornecedores}">
                <td th:text="${fornecedor.nome}"></td>
                <td th:text="${fornecedor.cnpj}"></td>
                <td th:text="${fornecedor.telefone}"></td>
                <td th:text="${fornecedor.email}"></td>
                <td>
                    <a th:href="@{/fornecedores/editar/{id}(id=${fornecedor.id})}">Editar</a>
                    &nbsp;
                    <a th:href="@{/fornecedores/excluir/{id}(id=${fornecedor.id})}"
                       onclick="return confirm('Confirma a exclusão deste fornecedor?')">Excluir</a>
                </td>
            </tr>
            <!-- Mensagem quando não há fornecedores cadastrados -->
            <tr th:if="${#lists.isEmpty(fornecedores)}">
                <td colspan="5">Nenhum fornecedor cadastrado.</td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="/">Voltar</a>

</body>
</html>
