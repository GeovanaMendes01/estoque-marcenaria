<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixas - Marcenaria Stock</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<aside class="sidebar">

    <div class="sidebar-logo">
        <i class="fas fa-tools sidebar-logo-icon"></i>
        <div class="sidebar-logo-texto">
            <span class="sidebar-logo-nome">Marcenaria</span>
            <span class="sidebar-logo-sub">Sistema de Estoque</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <div class="nav-grupo">
            <span class="nav-label">PRINCIPAL</span>
            <ul>
                <li>
                    <a href="/" class="nav-item">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">ESTOQUE</span>
            <ul>
                <li>
                    <a href="/produtos" class="nav-item">
                        <i class="fas fa-boxes"></i>
                        Produtos
                    </a>
                </li>
                <li>
                    <a href="/fornecedores" class="nav-item">
                        <i class="fas fa-truck"></i>
                        Fornecedores
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">MOVIMENTAÇÕES</span>
            <ul>
                <li>
                    <a href="/baixas" class="nav-item ativo">
                        <i class="fas fa-arrow-circle-down"></i>
                        Baixas
                    </a>
                </li>
            </ul>
        </div>

    </nav>

</aside>

<main class="conteudo">

    <div class="pagina-header">
        <div class="pagina-header-titulo">
            <i class="fas fa-arrow-circle-down"></i>
            <h1>Baixas</h1>
        </div>
        <a href="/baixas/cadastro" class="btn-novo">
            <i class="fas fa-plus"></i> Nova Baixa
        </a>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
            <tr>
                <th>Data</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="baixa : ${baixas}">
                <td th:text="${#temporals.format(baixa.data, 'dd/MM/yyyy')}"></td>
                <td th:text="${baixa.produto.nome}"></td>
                <td th:text="${baixa.quantidade}"></td>
                <td class="acoes-tabela">
                    <a th:href="@{/baixas/excluir/{id}(id=${baixa.id})}"
                       onclick="return confirm('Confirma a exclusão desta baixa?')">Excluir</a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(baixas)}">
                <td colspan="4" class="tabela-vazia">
                    Nenhuma baixa registrada.
                    <a href="/baixas/cadastro">Registrar agora</a>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</main>

</body>
</html>
