<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcenaria Stock</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<aside class="sidebar">

    <div class="sidebar-logo">
        <i class="fas fa-tools sidebar-logo-icon"></i>
        <div class="sidebar-logo-texto">
            <span class="sidebar-logo-nome">Marcenaria</span>
            <span class="sidebar-logo-sub">Sistema de Estoque</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <div class="nav-grupo">
            <span class="nav-label">PRINCIPAL</span>
            <ul>
                <li>
                    <a href="/" class="nav-item ativo">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">ESTOQUE</span>
            <ul>
                <li>
                    <a href="/produtos" class="nav-item">
                        <i class="fas fa-boxes"></i>
                        Produtos
                    </a>
                </li>
                <li>
                    <a href="/fornecedores" class="nav-item">
                        <i class="fas fa-truck"></i>
                        Fornecedores
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">MOVIMENTAÇÕES</span>
            <ul>
                <li>
                    <a href="/baixas" class="nav-item">
                        <i class="fas fa-arrow-circle-down"></i>
                        Baixas
                    </a>
                </li>
            </ul>
        </div>

    </nav>

</aside>

<main class="conteudo">
    <header>
        <h1>Sistema de Estoque da Marcenaria</h1>
        <p>Projeto desenvolvido para auxiliar no controle de produtos e fornecedores.</p>
    </header>

    <section class="acoes-rapidas">
        <h2 class="acoes-rapidas-titulo">Ações Rápidas</h2>

        <div class="acoes-rapidas-botoes">

            <a href="/produtos/cadastro" class="btn-acao btn-produto">
                <i class="fas fa-plus"></i>
                Novo Produto
            </a>

            <a href="/baixas/cadastro" class="btn-acao btn-baixa">
                <i class="fas fa-arrow-circle-down"></i>
                Nova Baixa
            </a>

            <a href="/fornecedores/cadastro" class="btn-acao btn-fornecedor">
                <i class="fas fa-truck"></i>
                Novo Fornecedor
            </a>

        </div>
    </section>
</main>

</body>
</html>
