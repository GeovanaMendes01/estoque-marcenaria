<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedor - Marcenaria Stock</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="pagina">

        <header>
            <h1 th:text="${fornecedor.id == null}
                ? 'Cadastro de Fornecedor'
                : 'Editar Fornecedor'">
            </h1>
        </header>

        <section>

            <p class="erro"
               th:if="${erro}"
               th:text="${erro}">
            </p>

            <form
                th:action="${fornecedor.id == null}
                ? @{/fornecedores/salvar}
                : @{/fornecedores/atualizar/{id}(id=${fornecedor.id})}"

                th:object="${fornecedor}"
                method="post">

                <input type="hidden" th:field="*{id}">

                <label for="nome">Nome</label>
                <input
                        type="text"
                        id="nome"
                        th:field="*{nome}"
                        placeholder="Nome do fornecedor">

                <label for="cnpj">CNPJ</label>
                <input
                        type="text"
                        id="cnpj"
                        th:field="*{cnpj}"
                        placeholder="00.000.000/0000-00">

                <label for="telefone">Telefone</label>
                <input
                        type="text"
                        id="telefone"
                        th:field="*{telefone}"
                        placeholder="(67) 99999-9999"
                        maxlength="15"
                        oninput="aplicarMascaraTelefone(this)">

                <label for="email">E-mail</label>
                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="contato@fornecedor.com">

                <button type="submit">
                    Salvar
                </button>

            </form>

        </section>

        <footer>
            <a href="/fornecedores">Voltar</a>
        </footer>

    </main>

    <script>
        function aplicarMascaraTelefone(campo) {

            let numeros = campo.value.replace(/\D/g, "");

            numeros = numeros.substring(0, 11);

            if (numeros.length > 10) {
                campo.value = numeros.replace(
                    /(\d{2})(\d{5})(\d{0,4})/,
                    "($1) $2-$3"
                );
            } else if (numeros.length > 6) {
                campo.value = numeros.replace(
                    /(\d{2})(\d{4})(\d{0,4})/,
                    "($1) $2-$3"
                );
            } else if (numeros.length > 2) {
                campo.value = numeros.replace(
                    /(\d{2})(\d{0,5})/,
                    "($1) $2"
                );
            } else {
                campo.value = numeros.replace(
                    /(\d{0,2})/,
                    "($1"
                );
            }
        }
    </script>

</body>
</html>
