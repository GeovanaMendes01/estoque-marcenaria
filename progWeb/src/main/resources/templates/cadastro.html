<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Produto - Marcenaria Stock</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<aside class="sidebar">

    <div class="sidebar-logo">
        <i class="fas fa-tools sidebar-logo-icon"></i>
        <div class="sidebar-logo-texto">
            <span class="sidebar-logo-nome">Marcenaria</span>
            <span class="sidebar-logo-sub">Sistema de Estoque</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <div class="nav-grupo">
            <span class="nav-label">PRINCIPAL</span>
            <ul>
                <li>
                    <a href="/" class="nav-item">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">ESTOQUE</span>
            <ul>
                <li>
                    <a href="/produtos" class="nav-item ativo">
                        <i class="fas fa-boxes"></i>
                        Produtos
                    </a>
                </li>
                <li>
                    <a href="/fornecedores" class="nav-item">
                        <i class="fas fa-truck"></i>
                        Fornecedores
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-grupo">
            <span class="nav-label">MOVIMENTAÇÕES</span>
            <ul>
                <li>
                    <a href="/baixas" class="nav-item">
                        <i class="fas fa-arrow-circle-down"></i>
                        Baixas
                    </a>
                </li>
            </ul>
        </div>

    </nav>

</aside>

<main class="conteudo">

    <div class="pagina-header">
        <div class="pagina-header-titulo">
            <i class="fas fa-boxes"></i>
            <h1>Novo Produto</h1>
        </div>
        <a href="/produtos" class="btn-voltar">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="form-card">

        <form action="/produtos/salvar" method="post">

            <div class="form-grupo">
                <label for="nome">Nome do Produto</label>
                <input id="nome" name="nome" type="text" placeholder="Ex: Compensado Naval 18mm">
            </div>

            <div class="form-grupo">
                <label for="descricao">Descrição</label>
                <input id="descricao" name="descricao" type="text" placeholder="Detalhes adicionais sobre o produto...">
            </div>

            <div class="form-grid-2">

                <div class="form-grupo">
                    <label for="quantidade">Quantidade em Estoque</label>
                    <input id="quantidade" name="quantidade" type="number" placeholder="0">
                </div>

                <div class="form-grupo">
                    <label for="preco">Preço (R$)</label>
                    <input id="preco" name="preco" type="number" step="0.01" placeholder="0,00">
                </div>

            </div>

            <div class="form-grupo">
                <label for="fornecedor">Fornecedor</label>
                <select id="fornecedor" name="fornecedor.id">
                    <option value="">Nenhum</option>
                    <option
                            th:each="fornecedor : ${fornecedores}"
                            th:value="${fornecedor.id}"
                            th:text="${fornecedor.nome}">
                    </option>
                </select>
            </div>

            <div class="form-botoes">
                <button type="submit" class="btn-salvar">
                    <i class="fas fa-save"></i> Salvar
                </button>
                <a href="/produtos" class="btn-cancelar">Cancelar</a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
